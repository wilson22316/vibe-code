<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極致倒數計時器</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <canvas id="particle-canvas"></canvas>
    <div class="container">
        <h1 class="title">專注時刻</h1>

        <div class="timer-display">
            <svg class="progress-ring" width="300" height="300">
                <circle class="progress-ring__circle-bg" stroke="#333" stroke-width="12" fill="transparent" r="120"
                    cx="150" cy="150" />
                <circle class="progress-ring__circle" stroke="url(#gradient)" stroke-width="12" fill="transparent"
                    r="120" cx="150" cy="150" />
                <defs>
                    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#ff00cc;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#333399;stop-opacity:1" />
                    </linearGradient>
                </defs>
            </svg>
            <div class="time-text" id="time-display">00:00</div>
        </div>

        <div class="controls-setup" id="setup-controls">
            <div class="input-group">
                <input type="number" id="minutes-input" placeholder="00" min="0" max="99" value="05">
                <span>:</span>
                <input type="number" id="seconds-input" placeholder="00" min="0" max="59" value="00">
            </div>
        </div>

        <div class="controls-action">
            <button id="start-btn" class="btn btn-primary">開始</button>
            <button id="pause-btn" class="btn btn-secondary hidden">暫停</button>
            <button id="reset-btn" class="btn btn-text">重置</button>
        </div>

        <div class="spotify-container">
            <iframe style="border-radius:12px"
                src="https://open.spotify.com/embed/playlist/37i9dQZF1DWWQRwui0ExPn?utm_source=generator&theme=0"
                width="100%" height="152" frameBorder="0" allowfullscreen=""
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                loading="lazy"></iframe>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
