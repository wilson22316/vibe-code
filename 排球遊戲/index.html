<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>沙灘排球</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div id="scoreboard">
        <div class="team home"><span class="serve-dot"></span>我方<b id="score-home">0</b></div>
        <div class="team away"><b id="score-away">0</b>對手<span class="serve-dot"></span></div>
      </div>
      <div id="game-over" hidden>
        <div id="game-over-title"></div>
        <div id="game-over-score"></div>
        <div class="again">按 空白鍵 再來一局</div>
      </div>
      <div id="result" hidden></div>
      <div id="judge"></div>
      <div id="power-bar" hidden><div id="power-fill"></div></div>
      <div id="hint">空白鍵：按住蓄力發球／外圈縮到黃圈時擊球、攔網　·　← →：瞄準、扣球方向</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
