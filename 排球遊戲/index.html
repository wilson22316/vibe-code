<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>沙灘排球</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div id="scoreboard">
        <div class="team home"><span class="serve-dot"></span>我方<b id="score-home">0</b></div>
        <div class="team away"><b id="score-away">0</b>對手<span class="serve-dot"></span></div>
      </div>
      <div id="game-over" hidden>
        <div id="game-over-title"></div>
        <div id="game-over-score"></div>
        <div class="again">按 空白鍵 回到選單</div>
      </div>
      <div id="menu" hidden>
        <div id="menu-title">沙灘排球</div>
        <div id="menu-sub">選擇對手難度</div>
        <div id="levels">
          <button data-level="easy">簡單</button>
          <button data-level="normal">普通</button>
          <button data-level="hard">困難</button>
        </div>
        <div id="graphics-row">畫質<button id="graphics-button"></button></div>
        <div class="again">← → 選擇難度　·　空白鍵 開始　·　G 切換畫質</div>
      </div>
      <div id="result" hidden></div>
      <div id="judge"></div>
      <div id="power-bar" hidden><div id="power-fill"></div></div>
      <div id="hint">空白鍵：按住蓄力發球／外圈縮到黃圈時擊球、攔網　·　← →：瞄準、扣球方向　·　M：靜音　·　G：畫質　·　拖曳／滾輪：轉動縮放鏡頭　·　C：視角</div>
      <div id="mute" hidden>靜音中</div>
      <div id="toast"></div>
      <button id="pause-button" hidden>暫停（Esc）</button>
      <div id="pause" hidden>
        <div id="pause-title">暫停</div>
        <div id="pause-options">
          <button data-option="resume">繼續</button>
          <button data-option="restart">重新開局</button>
          <button data-option="menu">回到主畫面</button>
        </div>
        <div class="again">↑ ↓ 選擇　·　空白鍵 確定　·　Esc 繼續</div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
